# This rule is not used by the project kukie-serving-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over serving.kukie.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kukie-serving-operator
    app.kubernetes.io/managed-by: kustomize
  name: servedmodel-admin-role
rules:
- apiGroups:
  - serving.kukie.io
  resources:
  - servedmodels
  verbs:
  - '*'
- apiGroups:
  - serving.kukie.io
  resources:
  - servedmodels/status
  verbs:
  - get
