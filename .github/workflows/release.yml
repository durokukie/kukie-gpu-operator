# 태그 v<차트 버전>을 달면 kukie-oven·kukie-counter·kukie-connector 이미지와 차트를 GHCR에 올린다. 패키지 공개 여부는 GitHub 패키지 설정을 따른다.
# 올리는 차트의 values에는 방금 만든 이미지들의 digest가 들어가므로 사용자는 --set 없이 그 이미지를 받는다.
# docker 빌드가 필요하고 태그는 드물어서 GitHub-hosted에서 돈다.
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    name: push kukie-oven, kukie-counter and kukie-connector images and kukie-gpu chart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must match the chart version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          chart="$(awk '/^version:/ {print $2}' charts/kukie-gpu/Chart.yaml)"
          if [ "$version" != "$chart" ]; then
            echo "::error::태그 $TAG 와 Chart.yaml version $chart 가 다릅니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the oven image
        id: oven_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: oven
          platforms: linux/amd64
          push: true
          tags: ghcr.io/durokukie/kukie-oven:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push the counter image
        id: counter_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: counter
          platforms: linux/amd64
          push: true
          tags: ghcr.io/durokukie/kukie-counter:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push the connector image
        id: connector_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: connector
          platforms: linux/amd64
          push: true
          tags: ghcr.io/durokukie/kukie-connector:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - name: Pin the images in the chart values
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OVEN_DIGEST: ${{ steps.oven_image.outputs.digest }}
          COUNTER_DIGEST: ${{ steps.counter_image.outputs.digest }}
          CONNECTOR_DIGEST: ${{ steps.connector_image.outputs.digest }}
        run: |
          python3 scripts/set_image.py oven "$VERSION" "$OVEN_DIGEST"
          python3 scripts/set_image.py counter "$VERSION" "$COUNTER_DIGEST"
          python3 scripts/set_image.py connector "$VERSION" "$CONNECTOR_DIGEST"
          # 올리기 전에 두 이미지가 각자의 digest로 렌더되는지 본다. 사용자가 넣는 값은 자리 채우기다.
          helm template kukie-gpu charts/kukie-gpu --namespace default --set oven.enabled=true \
            --set counter.enabled=true --set counter.keysSecret=release-check \
            --set-json 'counter.models={"release-check":{"upstream":"http://release-check:8000","maxConcurrent":1}}' \
            --set connector.enabled=true --set connector.counterKeySecret=release-check-key \
            --set connector.gateway=https://release-check.invalid/connector/v1/connect \
            --set connector.clusterId=00000000-0000-0000-0000-000000000000 \
            > "$RUNNER_TEMP/rendered.yaml"
          grep -qF "kukie-oven:$VERSION@$OVEN_DIGEST" "$RUNNER_TEMP/rendered.yaml"
          grep -qF "kukie-counter:$VERSION@$COUNTER_DIGEST" "$RUNNER_TEMP/rendered.yaml"
          grep -qF "kukie-connector:$VERSION@$CONNECTOR_DIGEST" "$RUNNER_TEMP/rendered.yaml"
      - name: Package and push the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/kukie-gpu --destination "$RUNNER_TEMP/chart"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/kukie-gpu-$VERSION.tgz" oci://ghcr.io/durokukie/charts
