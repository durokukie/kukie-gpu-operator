# 태그 v<차트 버전>을 달면 kukie-oven 이미지와 차트를 GHCR에 올린다. 패키지 공개 여부는 GitHub 패키지 설정을 따른다.
# 올리는 차트의 values에는 방금 만든 이미지의 digest가 들어가므로 사용자는 --set 없이 그 이미지를 받는다.
# docker 빌드가 필요하고 태그는 드물어서 GitHub-hosted에서 돈다.
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    name: push kukie-oven image and kukie-gpu chart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must match the chart version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          chart="$(awk '/^version:/ {print $2}' charts/kukie-gpu/Chart.yaml)"
          if [ "$version" != "$chart" ]; then
            echo "::error::태그 $TAG 와 Chart.yaml version $chart 가 다릅니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: oven
          platforms: linux/amd64
          push: true
          tags: ghcr.io/durokukie/kukie-oven:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - name: Pin the image in the chart values
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 scripts/set_oven_image.py "$VERSION" "$DIGEST"
          helm template kukie-gpu charts/kukie-gpu --namespace default --set oven.enabled=true > /dev/null
      - name: Package and push the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/kukie-gpu --destination "$RUNNER_TEMP/chart"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/kukie-gpu-$VERSION.tgz" oci://ghcr.io/durokukie/charts
