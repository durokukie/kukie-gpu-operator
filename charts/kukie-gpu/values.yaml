# Kukie GPU 애드온 1층(관측)의 설정값. 기본값은 우리 클러스터 kukie-gpu(kukie-gpu-infra runbooks/cluster.md) 기준이다.
# 다른 클러스터는 이 값만 바꿔 설치한다. 렌더 결과는 기본값일 때 kubernetes/ 아래 YAML과 같아야 한다
# (scripts/chart_diff.py가 CI에서 비교한다).

image:
  # 모든 이미지의 레지스트리를 한 곳으로 바꿀 때(사설 미러). 비우면 이미지마다 적힌 원래 주소를 쓴다.
  registry: ""

# GPU 노드를 고르는 조건. DCGM·장치 플러그인·데모 vLLM 모두 이 값을 쓴다.
gpuNode:
  nodeSelector:
    kukie.io/accelerator: nvidia-l40s
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# namespace 두 개를 유지하는 것이 기본이다(Kukie 읽기 RBAC가 이 둘에만 Pod 목록·프록시를 준다).
# 하나로 합치려면 metrics와 llm을 같은 이름으로 두고 그 namespace에 설치한다.
# 설치 대상(--namespace)과 같은 이름은 만들지 않는다(--create-namespace가 만든다).
namespaces:
  create: true
  metrics: gpu-metrics
  llm: llm

# GPU 사용률·메모리·전력·온도. GPU 노드에만 뜨므로 노드가 0대면 Pod 0개, 비용 없음.
dcgm:
  enabled: true
  image:
    registry: nvcr.io
    repository: nvidia/k8s/dcgm-exporter
    # 4.5.2-4.8.1 (2026-02-09 빌드)
    tag: 4.5.2-4.8.1-ubuntu22.04
    digest: sha256:17e9d49093f2d86d90260eec3c07b18b3f78fc5eadef3c8ab26a24fa5a9c1b2c
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # 클러스터 안에서 :9400/metrics에 닿는 ClusterIP. helm test가 쓴다. Kukie 화면은 API 서버 Pod 프록시로
  # 읽으므로 이 Service가 없어도 된다.
  service:
    enabled: true

# NVIDIA 장치 플러그인(nvidia.com/gpu 자원). 이미 GPU Operator나 다른 플러그인이 있는 클러스터는 끈 채로 둔다.
devicePlugin:
  enabled: false
  namespace: kube-system
  image:
    registry: nvcr.io
    repository: nvidia/k8s-device-plugin
    tag: v0.20.1
    digest: sha256:27c1b2553a690ca3d29889dcd61df97525d46f58272c0be8dc63c2b18f120075

# Kukie 연결 역할(그룹)이 위 두 namespace의 Pod 목록과 Pod 프록시(GET)를 읽게 하는 RoleBinding.
# ClusterRole 자체는 kukie-infra의 GPU 읽기 RBAC(gpu-read-rbac-v1.yaml)가 만든다. 이 차트는 묶기만 한다.
rbac:
  enabled: true
  clusterRole: kukie-gpu-metrics
  readerGroup: kukie-gpu-reader

# 데모 vLLM 서버. 3층(ServedModel)이 오면 그쪽이 대신한다. 기본은 끔.
demoVllm:
  enabled: false
  name: vllm-gpt-oss-20b
  instance: gpt-oss-20b
  model: openai/gpt-oss-20b
  image:
    registry: ""   # Docker Hub
    repository: vllm/vllm-openai
    tag: v0.32.0
    digest: sha256:6ee133356d49ed24cee03dd0cda3d3980279a11c107ce3e752c89e76540f41c9
  # --model과 --port 8000 사이에 들어가는 엔진 옵션. kukie-gpu-infra의 scripts/llm-bench/bench.sh와 같다.
  args:
    - --max-model-len
    - "16384"
    - --gpu-memory-utilization
    - "0.92"
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      nvidia.com/gpu: 1
      memory: 28Gi   # g6e.xlarge has 32 GiB
  cacheSize: 40Gi    # Hugging Face 캐시 emptyDir
  shmSize: 2Gi
  # 첫 기동은 모델(약 13GB)을 받느라 오래 걸린다. 10초 × 240 = 40분.
  startupFailureThreshold: 240

# helm test(DCGM /metrics 200)가 쓰는 curl 이미지
test:
  image:
    registry: ""   # Docker Hub
    repository: curlimages/curl
    tag: 8.11.1
    digest: sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69

# 설치·업그레이드 직후 한 번 도는 점검 Job(post-install·post-upgrade hook). GPU 자원, 드라이버, 허깅페이스 접속, 스토리지,
# 권한 다섯 가지를 보고 "빠진 것 목록"을 ConfigMap kukie-gpu-preflight(설치 namespace)의 data.result.json에 남긴다.
# 검사가 실패해도 Job은 성공으로 끝나 설치를 막지 않는다. Job 자체가 못 돌면(이미지를 못 받는 폐쇄망 등) helm이
# 실패로 끝나니 그때는 enabled=false로 설치한다. 스크립트는 files/preflight.sh.
preflight:
  enabled: true
  image:
    registry: ""   # Docker Hub
    repository: alpine/kubectl
    # kubectl 1.36(kukie-gpu EKS와 같은 버전) + curl, 23MB
    tag: 1.36.4
    digest: sha256:a2cd8ee034cbe04d651e565b3373299b31921de5c2af86490559e21b3e197808
  # 허깅페이스 접속 검사: 10초 안에 200이어야 통과
  huggingfaceUrl: https://huggingface.co/api/models?limit=1
  # 드라이버 검사: GPU 노드 위 DCGM exporter Pod가 Running이 될 때까지 기다리는 시간(초). 첫 설치에서 이미지(1GB대)를
  # 아직 받는 중이면 실패가 아니라 건너뜀으로 기록한다.
  dcgmWaitSeconds: 60
  # 스토리지 검사용 테스트 PVC. storageClassName을 비우면 클러스터 기본 StorageClass를 쓴다. 만들고 바로 지운다
  # (Job Pod가 소유자라 Job이 죽어도 같이 지워진다). WaitForFirstConsumer StorageClass는 Pod가 붙어야 볼륨이 생기므로
  # StorageClass·CSI 드라이버 존재까지만 보고 건너뜀으로 기록한다.
  storage:
    storageClassName: ""
    size: 1Gi
    waitSeconds: 60
  # 권한 검사: 2층 측정 Job·3층 ServedModel이 쓸 ServiceAccount가 namespace(비우면 namespaces.llm)에 Deployment·Job·PVC를
  # 만들 수 있는지 SubjectAccessReview로 본다. serviceAccount를 비우면(1층만 쓸 때) 건너뛴다.
  permission:
    serviceAccount: ""
    namespace: ""
  # Job 전체 제한(초). 최악 경로는 dcgmWaitSeconds + 10 + storage.waitSeconds + PVC 삭제 대기 60 ≈ 190초 + Pod 뜨는 시간.
  # helm --timeout(기본 5분=300초)보다 짧아야 설치가 막히지 않는다. 대기 값을 올리면 둘 다 같이 올린다.
  activeDeadlineSeconds: 270
  # 끝난 Job을 남겨 두는 시간(초). 결과는 ConfigMap에 있으니 Job은 로그 확인용이다.
  ttlSecondsAfterFinished: 86400
  # 프록시가 필요한 클러스터: [{name: HTTPS_PROXY, value: http://proxy:3128}, {name: NO_PROXY, value: 10.0.0.0/8}]
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

# 3층 오퍼레이터 kukie-oven. ServedModel을 보고 모델 다운로드와 vLLM 배포를 맡는다(runbooks/oven.md).
# 기본은 꺼 둔다. 1층만 쓰는 사용자에게 CRD와 클러스터 권한이 늘지 않게 하려는 것이다.
oven:
  enabled: false
  image:
    registry: ghcr.io
    repository: durokukie/kukie-oven
    # GHCR에 올린 차트는 릴리스 CI가 tag와 digest를 채운다. 저장소의 차트로 설치할 때는 --set으로 넣는다.
    tag: ""
    digest: ""
  # 비공개 패키지를 받을 때 쓰는 Secret 이름 목록. 예: [{name: ghcr-pull}]
  imagePullSecrets: []
  # 다운로드 Job 하나의 시간 상한(재시도 포함). 아주 큰 모델은 올린다.
  downloadDeadline: 2h
  # 모델 한 개의 실행 시간 상한. 처음 처리한 때부터 세므로 다운로드와 적재 시간도 들어간다. 지나면 다운로드와 vLLM을 멈춰
  # GPU 파드가 없어지고, 노드 자동 확장기가 노드를 내린다. PVC는 남긴다. 0이면 저절로 멈추지 않는다.
  # 모델마다 spec.maxRuntime으로, 잠깐 늘릴 때는 annotation serving.kukie.io/keep-until로 바꾼다(runbooks/oven.md).
  maxRuntime: 2h
  # 파드가 노드를 못 받을 때 Pending/WaitingForNode로 기다려 주는 시간. 넘으면 Failed/Unschedulable.
  # 0이면 기다리지 않는다. 새 GPU 노드가 뜨고 GPU를 등록하는 시간보다 길어야 한다.
  nodeWaitTimeout: 15m
  # 측정: ServedModel에 serving.kukie.io/measure=true를 달면 도는 Job(runbooks/oven.md). GPU를 채우므로 사람이 달아야
  # 돌고 시간 상한이 있다. 이미지는 그 모델의 spec.engine.image를 쓰고, 이 값을 바꾸면 다음 측정부터 적용된다.
  measure:
    deadline: 1h
    # 동시 요청 단계. SLA를 넘는 첫 단계에서 멈춘다.
    concurrency: "1 2 4 8 16 32 64"
    inputTokens: 1000
    outputTokens: 200
    # SLA: TTFT p95, ITL p95(밀리초)
    ttftMs: 1000
    itlMs: 50
    # 기준선 재사용: 기준선이 없는 Ready 모델은 같은 이름의 측정 기록 중 모델·이미지·GPU 수·GPU 종류·엔진 인자·위 측정 값이
    # 모두 같고 partial이 아닌 가장 최근 것을 status.baseline에 채운다. 이 시간보다 오래된 기록은 쓰지 않는다. 0이면 끈다.
    reuseMaxAge: 720h
    # GPU 종류를 읽을 노드 라벨, 앞의 것이 먼저. 측정한 노드의 값이 기록에 남고 재사용 때 비교한다.
    gpuTypeLabels:
      - nvidia.com/gpu.product
      - node.kubernetes.io/instance-type
  # python3와 hf CLI가 있는 다운로드용 이미지. 비우면 ServedModel의 spec.engine.image를 쓴다.
  downloadImage: ""
  # 오븐 파드 자신의 배치. 다운로드 Job과 vLLM의 GPU 노드 조건은 위 gpuNode.nodeSelector를 쓴다.
  nodeSelector: {}
  tolerations: []
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

# 키 발급제 API 입구 kukie-counter(runbooks/counter.md). 모델 서버 앞에서 키를 확인하고 모델별 동시 수 한도를 지킨다.
# 기본은 꺼 둔다. 켜면 설치 namespace에 ServiceAccount, ConfigMap, Deployment, Service(ClusterIP)를 만든다. discovery를 켜야만
# 쿠버네티스 API를 읽고(ServedModel 읽기 Role 하나), 밖으로 내는 Ingress는 ingress를 켤 때만 만든다.
# Pod 수는 값으로 두지 않고 1로 고정한다. 자리 수를 Pod끼리 나누지 않아서 Pod가 N개면 실제 한도가 N배가 된다.
counter:
  enabled: false
  # 오븐과 별도 키다. 레포를 나눠도 차트에서 이 블록만 따로 움직이면 되게 한다.
  image:
    registry: ghcr.io
    repository: durokukie/kukie-counter
    # GHCR에 올린 차트는 릴리스 CI가 tag와 digest를 채운다. 저장소의 차트로 설치할 때는 --set으로 넣는다.
    tag: ""
    digest: ""
  # 비공개 패키지를 받을 때 쓰는 Secret 이름 목록. 설치 namespace에 있어야 한다. 예: [{name: ghcr-pull}]
  imagePullSecrets: []
  # 사용자가 미리 만든 Secret의 이름. 설치 namespace에 있어야 하고 data 키는 keys.json이다. 차트는 Secret을 만들지 않으며
  # 키나 해시를 values로 받는 길도 없다(만드는 법은 runbooks/counter.md). 켜면 필수다.
  keysSecret: ""
  # 모델 이름(요청의 model과 정확히 같게)별 upstream과 동시 수 한도. 켜면 하나 이상 필수다. 모델을 지우려면 값을 null로 둔다.
  # upstream은 클러스터마다 다르므로 기본값을 두지 않는다. 예시:
  #   models:
  #     org/model-name:
  #       upstream: http://<서비스>.<namespace>.svc:8000
  #       maxConcurrent: 8   # 사람이 정한 한도. discovery를 켜면 빼도 되고, 빼면 ServedModel 기준선에서 정한다
  models: {}
  # ServedModel을 읽어 모델과 한도를 자동으로 정한다(runbooks/counter.md "기준선으로 한도 정하기"). 켜면 models를 비워도 된다.
  # 한도 = floor(status.baseline.maxConcurrency × safetyFactor), 최소 1. 기준선이 없거나 스펙이 바뀐 뒤면 defaultMaxConcurrent.
  # models에 maxConcurrent를 적은 모델은 그 값이 이긴다. 같은 이름의 upstream도 models의 값이 이긴다.
  discovery:
    enabled: false
    # ServedModel을 읽을 namespace. 비우면 namespaces.llm. 이 namespace에만 servedmodels get·list 권한을 준다.
    namespace: ""
    safetyFactor: 0.8
    defaultMaxConcurrent: 4
    # ServedModel을 다시 읽는 주기(초). 기준선은 사람이 측정을 눌러야 바뀌므로 짧을 필요가 없다.
    intervalSeconds: 30
  # 429와 503의 Retry-After(초)
  retryAfterSeconds: 2
  # 요청 본문 상한(바이트). 본문은 메모리로 읽으므로 아래 메모리 limit과 같이 본다.
  maxBodyBytes: 16777216
  # 공개 입구. AWS Load Balancer Controller가 있는 클러스터에서 ALB로 받는다(runbooks/counter.md "공개 입구"). HTTPS만 받고
  # 80은 443으로 돌린다. 지표 포트는 나가지 않는다.
  ingress:
    enabled: false
    # 켜면 필수. 예: api.gpu.example.com
    host: ""
    # 켜면 필수. host를 담은 ACM 인증서의 ARN. 같은 리전에 있고 발급이 끝나 있어야 한다.
    certificateArn: ""
    # 같은 값의 Ingress가 ALB 하나를 같이 쓴다. 포털(kukie-gpu-web 차트의 ingress.groupName)과 같게 둔다.
    groupName: kukie-gpu-public
  # 카운터 자신의 배치. GPU taint를 허용하지 않고, gpuNode.nodeSelector에 맞는 노드도 affinity로 뺀다. GPU 노드에 뜨면
  # 빈 노드가 되지 않아 노드 자동 확장기가 그 노드를 내리지 못한다.
  nodeSelector: {}
  tolerations: []
  # CPU limit은 두지 않는다. 쓰로틀링이 그대로 스트림 지연이 되기 때문이다.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
