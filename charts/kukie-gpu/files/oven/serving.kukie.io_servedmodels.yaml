---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: servedmodels.serving.kukie.io
spec:
  group: serving.kukie.io
  names:
    kind: ServedModel
    listKind: ServedModelList
    plural: servedmodels
    shortNames:
    - sm
    singular: servedmodel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.huggingface
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ServedModel is the Schema for the servedmodels API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ServedModel
            properties:
              admission:
                description: admission is the admission proxy sidecar (fields only
                  in this version).
                properties:
                  baselineRef:
                    description: baselineRef names the ConfigMap with the measured
                      baseline. Empty means conservative defaults.
                    maxLength: 253
                    type: string
                  enabled:
                    description: 'enabled turns the proxy sidecar on. Not implemented
                      yet: the Deployment has no sidecar whatever the value.'
                    type: boolean
                type: object
              engine:
                description: engine is the vLLM container.
                properties:
                  args:
                    description: args are extra vLLM flags appended after --model,
                      --tensor-parallel-size and --port.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  gpus:
                    default: 1
                    description: gpus is the number of GPUs for one Pod (tensor-parallel-size).
                      Multi-node is out of scope.
                    format: int32
                    maximum: 8
                    minimum: 1
                    type: integer
                  image:
                    description: image is the vLLM image. It must be pinned by digest
                      so the catalog entry "this image works" stays true.
                    maxLength: 512
                    pattern: '@sha256:[a-f0-9]{64}$'
                    type: string
                  resources:
                    description: |-
                      resources for the vLLM container. The GPU limit is always set from gpus and cannot be overridden here.
                      Empty means the defaults for a g6e.xlarge-class node (2 CPU / 16Gi request, 28Gi limit).
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                required:
                - image
                type: object
              maxRuntime:
                description: |-
                  maxRuntime is how long the model may run, counted from status.startedAt, so download and load time are included.
                  After that the download Job and vLLM stop and the phase becomes Stopped; the PVC stays. Empty uses the manager flag
                  --max-runtime (chart value oven.maxRuntime). "0" never stops on its own. Hours, minutes and seconds, e.g. 2h, 1h30m
                  or 90m. With hours, minutes and seconds stay under 60.
                  The pattern keeps out what Go cannot parse: one such value would break reading every ServedModel. It also holds what
                  Go writes back (1h0m0s, 169h25m39s), so reading an object and updating it can never be refused.
                maxLength: 12
                minLength: 1
                pattern: ^(0|[0-9]{1,5}h([0-5]?[0-9]m)?([0-5]?[0-9]s)?|([0-9]{1,4}m)?([0-9]{1,4}s)?)$
                type: string
              source:
                description: source is where the model files come from.
                properties:
                  huggingface:
                    description: huggingface is the Hub repository, e.g. "Qwen/Qwen3.6-35B-A3B".
                    maxLength: 200
                    minLength: 3
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$
                    type: string
                  tokenSecretRef:
                    description: |-
                      tokenSecretRef names a Secret in the same namespace whose key "token" holds a Hugging Face token.
                      Needed only for gated models.
                    maxLength: 253
                    type: string
                required:
                - huggingface
                type: object
              storage:
                description: storage is the PVC for the model files.
                properties:
                  retainOnDelete:
                    description: retainOnDelete keeps the PVC (the model files) when
                      the ServedModel is deleted.
                    type: boolean
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size of the PVC, e.g. 120Gi. Must cover the model
                      files; the download fails with "No space left" otherwise.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: storageClassName of the PVC. Empty uses the cluster
                      default.
                    maxLength: 253
                    type: string
                required:
                - size
                type: object
            required:
            - engine
            - source
            - storage
            type: object
          status:
            description: status defines the observed state of ServedModel
            properties:
              baseline:
                description: baseline is the admission baseline from the last measurement
                  run.
                properties:
                  generation:
                    description: |-
                      generation is the spec generation that was measured. Older than metadata.generation means the numbers describe
                      a different model or engine setting.
                    format: int64
                    type: integer
                  maxConcurrency:
                    description: maxConcurrency is the highest concurrent request
                      count that stayed within the SLA.
                    format: int32
                    type: integer
                  maxKvPercent:
                    description: maxKvPercent is the KV-cache usage above which the
                      proxy answers 429.
                    format: int32
                    type: integer
                  maxWaiting:
                    description: maxWaiting is the number of waiting requests above
                      which the proxy answers 429.
                    format: int32
                    type: integer
                  measuredAt:
                    description: measuredAt is when the baseline was measured.
                    format: date-time
                    type: string
                  partial:
                    description: |-
                      partial is true when the run ended early (the client failed or the time limit came) rather than at an SLA limit.
                      The numbers are then a lower bound: the server may take more.
                    type: boolean
                type: object
              conditions:
                description: 'conditions: Downloaded, Ready, Measured.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              download:
                description: download is the progress of the download Job.
                properties:
                  percent:
                    description: percent is 0 while the Job runs and 100 when it has
                      succeeded. Finer progress is a later issue.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                required:
                - percent
                type: object
              message:
                description: message is a human-readable detail. For Failed it carries
                  the Pod or Job message as is.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              phase:
                description: 'phase: Pending | Downloading | Loading | Ready | Measuring
                  | Failed | Stopped'
                enum:
                - Pending
                - Downloading
                - Loading
                - Ready
                - Measuring
                - Failed
                - Stopped
                type: string
              reason:
                description: reason is a CamelCase word for the current phase (mostly
                  for Failed). Pattern-table classification is DURO-171.
                type: string
              startedAt:
                description: |-
                  startedAt is when the operator first handled this ServedModel. The run time limit counts from here. It never
                  changes afterwards, so a restart of the operator does not extend the limit.
                format: date-time
                type: string
              stopsAt:
                description: |-
                  stopsAt is when the model stops for running too long: the later of startedAt + maxRuntime and the keep-until
                  annotation. Empty means it never stops on its own. A measurement in progress may run past it.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
