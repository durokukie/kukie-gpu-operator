apiVersion: v2
name: kukie-gpu
description: >-
  Kukie GPU 애드온 1층(관측). GPU 노드의 DCGM exporter와 Kukie가 읽을 RBAC를 한 번에 설치하고,
  설치 직후 preflight Job이 빠진 것(GPU·드라이버·허깅페이스·스토리지·권한)을 ConfigMap에 남긴다.
  선택으로 NVIDIA 장치 플러그인과 데모 vLLM(openai/gpt-oss-20b)도 올린다.
  oven.enabled로 3층 오퍼레이터 kukie-oven도 올린다.
type: application
version: 0.5.1
# DCGM exporter 이미지 버전
appVersion: "4.5.2-4.8.1"
kubeVersion: ">=1.29.0-0"
home: https://github.com/durokukie/kukie-gpu-operator
sources:
  - https://github.com/durokukie/kukie-gpu-operator/tree/main/charts/kukie-gpu
keywords:
  - gpu
  - dcgm
  - vllm
