{{- if .Values.demoVllm.enabled }}
{{- $v := .Values.demoVllm }}
# One vLLM server for the Kukie GPU view demo and the in-cluster measure.sh Job. Same image and engine flags as
# scripts/llm-bench/bench.sh. The Pod needs a GPU node; with the GPU node group at 0 it stays Pending and costs nothing.
# No API key and no Ingress: reachable only inside the cluster (Service) and through the API server Pod proxy (GET).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $v.name }}
  namespace: {{ .Values.namespaces.llm }}
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: {{ $v.instance }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # one GPU per node: a rolling update would wait forever for a second GPU
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: {{ $v.instance }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: {{ $v.instance }}
    spec:
      {{- include "kukie-gpu.gpuNodeScheduling" . | trim | nindent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: vllm
          image: {{ include "kukie-gpu.image" (dict "root" $ "img" $v.image) }}
          args:
            - --model
            - {{ $v.model }}
            {{- range $v.args }}
            - {{ . | quote }}
            {{- end }}
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          # The model downloads from Hugging Face on every start (no cache volume yet), so the first start is slow.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: {{ $v.startupFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: {{ $v.cacheSize }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $v.shmSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}
  namespace: {{ .Values.namespaces.llm }}
spec:
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: {{ $v.instance }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
