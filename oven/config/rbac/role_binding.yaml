apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: kukie-oven
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
---
# The namespaced half of manager-role (role.yaml) belongs in each namespace the oven watches (--watch-namespaces). The
# chart, the install path, makes one Role and RoleBinding per entry of oven.namespaces. Note that config/default's
# namespace: moves this one to the deploy namespace, so `make deploy` needs --watch-namespaces set to that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: kukie-oven
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
