# 차트가 원본: charts/kukie-gpu (templates/device-plugin.yaml, devicePlugin.enabled). 이 파일은 손 apply 하던 때의
# 모양을 남겨 둔 비교 기준이고, scripts/chart_diff.py가 차트 렌더와 같은지 CI에서 확인한다. 바꿀 때는 차트를 먼저 바꾼다.
# NVIDIA device plugin: tells the kubelet how many GPUs a node has (nvidia.com/gpu), so Pods can request them.
# The EKS AL2023 NVIDIA image already has the driver and container toolkit, but not this plugin.
# Upstream static manifest of v0.20.1 (deployments/static/nvidia-device-plugin.yml), plus a digest pin and a node
# selector so it runs only on GPU nodes. The GPU Operator (next bundle) replaces it; delete this then.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        kukie.io/accelerator: nvidia-l40s
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1@sha256:27c1b2553a690ca3d29889dcd61df97525d46f58272c0be8dc63c2b18f120075
          env: []
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubelet-device-plugins-dir
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: kubelet-device-plugins-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
